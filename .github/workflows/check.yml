name: Notebook checks
on: [push, pull_request]
jobs:
  web-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify checked-in Xcode project metadata
        run: |
          test -f native/Sideleaf.xcodeproj/project.pbxproj
          test -f native/Sideleaf.xcodeproj/xcshareddata/xcschemes/Sideleaf.xcscheme
          test -f native/Sources/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          grep -Eq 'MARKETING_VERSION = [^;]+;' native/Sideleaf.xcodeproj/project.pbxproj
          grep -Eq 'CURRENT_PROJECT_VERSION = [^;]+;' native/Sideleaf.xcodeproj/project.pbxproj
          grep -q 'ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon;' native/Sideleaf.xcodeproj/project.pbxproj
          grep -q 'INFOPLIST_KEY_ITSAppUsesNonExemptEncryption = NO;' native/Sideleaf.xcodeproj/project.pbxproj
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run test:e2e
      - run: npm run test:pwa
