name: Notebook checks
on: [push, pull_request]
jobs:
  web-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify checked-in Xcode project
        run: |
          test -f native/Sideleaf.xcodeproj/project.pbxproj
          test -f native/Sideleaf.xcodeproj/xcshareddata/xcschemes/Sideleaf.xcscheme
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run test:e2e
      - run: npm run test:pwa
