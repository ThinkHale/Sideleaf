name: Sideleaf
options:
  bundleIdPrefix: com.thinkhale
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '2'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: MZ3635323W
targets:
  Sideleaf:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thinkhale.sideleaf
        TARGETED_DEVICE_FAMILY: '2'
        # Keep development builds working until the approved opaque 1024×1024 icon is packaged.
        ASSETCATALOG_COMPILER_APPICON_NAME: ''
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sideleaf
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Live in-person transcription after you confirm participant consent. Audio is not saved.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  SideleafTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: '2'
    dependencies:
      - target: Sideleaf
schemes:
  Sideleaf:
    build:
      targets:
        Sideleaf: all
    test:
      targets: [SideleafTests]
